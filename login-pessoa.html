<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login Conecta Mundos</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="./imgs/logo_degrade.png" alt="Logo Conecta Mundos">
        </div>
        <div class="navegacao">

        </div>

    </header>

    <main>
        <div class="textos">
            <div class="title">
            <h2>Bem-vindo de volta</h2>
            </div>
            <div class="logins">
            <p>Ainda não tem uma conta? <span><a href="./cadastro-pessoa.html">Cadastre-se grátis</a></span></p>
            <p>Tem uma ONG? <span><a href="./cadastro-ong.html">Cadastre-se</a></span></p>
            </div>
        </div>
        
        <div class="login-rapidos">
            <button><img class="icone" src="./imgs/google (1).png" alt="icone">Google</button>
            <button> <img class="icone" src="./imgs/facebook.png" alt="icone">Facebook</button>
        </div>

        <div class="divisao">
            <hr> <p>Ou entre com e-mail</p> <hr>
        </div>


        <div class="formulario">

            <input type="text" placeholder="Digite seu e-mail">
            <input type="password" placeholder="Digite sua senha">


            <div class="botao">
                <button class="entrar">Entrar</button>
            </div>
        </div>
    </main>
    
</body>
</html>
