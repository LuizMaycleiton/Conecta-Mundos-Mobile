<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de ONG - Conecta Mundos</title>
    <link rel="stylesheet" href="../../public/css/config.css">
    <link rel="stylesheet" href="../../public/css/login.css">
    <script src="../../public/js/config.js"></script>
</head>

<body>
    <header>
        <div class="logo">
            <a href="../../views/pages/index.html">
                <img src="../../public/imagem/logo_degrade.png" alt="Logo Conecta Mundos">
            </a>
        </div>
        <div class="navegacao">
            <a href="./login-ongs.html" class="btn-voltar">← Voltar</a>
        </div>
    </header>

    <!-- "main-cadastro" deixa os blocos lado a lado em telas grandes -->
    <main class="main-cadastro">
        <div class="textos">
            <div class="title">
                <h2>Cadastre sua <span>ONG</span></h2>
            </div>
            <p class="subtitulo">Preencha as informações abaixo para cadastrar sua organização na plataforma.</p>
        </div>

        <form class="formulario" action="cadastro-ong-prosseguir.html" method="GET">
            <fieldset>
                <legend>Informações Básicas</legend>

                <div class="campo">
                    <label for="ong">Nome da ONG</label>
                    <input type="text" id="ong" name="ong" placeholder="Digite aqui..." required>
                </div>

                <div class="campo">
                    <label for="descricao">Descreva sua organização</label>
                    <textarea name="descricao" id="descricao" rows="4" placeholder="Descreva a missão e as atividades da sua ONG..." required></textarea>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select name="categoria" id="categoria">
                        <option value="educacao">Educação</option>
                        <option value="saude">Saúde</option>
                        <option value="meio_ambiente">Meio Ambiente</option>
                        <option value="moradia">Moradia</option>
                        <option value="direitos_humanos">Direitos Humanos</option>
                        <option value="cultura">Cultura</option>
                        <option value="alimentacao">Alimentação</option>
                        <option value="animais">Animais</option>
                        <option value="causas_emergenciais">Causas Emergenciais</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="metrica">Métrica de Impacto</label>
                    <input type="text" id="metrica" name="metrica" placeholder="Ex.: 500 famílias atendidas">
                </div>
            </fieldset>

            <fieldset>
                <legend>Contato e Localização</legend>

                <div class="campo">
                    <label for="email">E-mail de contato</label>
                    <input type="email" id="email" name="email" placeholder="email.contato@ong.org" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>

                <div class="campo">
                    <label for="site">Website</label>
                    <input type="url" id="site" name="site" placeholder="https://www.suaong.org">
                </div>

                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro">
                </div>

                <div class="linha-dupla">
                    <div class="campo">
                        <label for="estado">Estado</label>
                        <select name="estado" id="estado">
                            <option value="SP">São Paulo</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="ES">Espírito Santo</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Engajamento e Acesso</legend>

                <div class="campo">
                    <label for="doacoes">É possível fazer doações recorrentes (mensais)?</label>
                    <input type="text" id="doacoes" name="doacoes" placeholder="Ex.: Sim, via PIX ou cartão">
                </div>

                <div class="campo">
                    <label for="voluntarios">Como os voluntários podem sugerir ideias ou melhorias?</label>
                    <textarea name="voluntarios" id="voluntarios" rows="4" placeholder="Responda aqui..."></textarea>
                </div>

                <div class="campo">
                    <label for="resultados">Quais resultados os voluntários ajudam a alcançar?</label>
                    <textarea name="resultados" id="resultados" rows="4" placeholder="Responda aqui..."></textarea>
                </div>

                <div class="campo">
                    <label for="senha">Crie uma senha de acesso para a ONG</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha..." required>
                </div>
            </fieldset>

            <div class="botao">
                <button type="submit" class="entrar">Cadastrar</button>
            </div>
        </form>
    </main>

    <footer></footer>

    <!-- Configurações (fonte e tema) -->
    <div class="config">
        <div class="config-painel" id="config-painel" hidden>
            <h3>Configurações</h3>

            <div class="config-grupo">
                <span>Tamanho da fonte</span>
                <div class="config-linha">
                    <button type="button" id="fonte-menos" aria-label="Diminuir fonte">A−</button>
                    <div class="config-valor" id="fonte-valor" aria-live="polite">100%</div>
                    <button type="button" id="fonte-mais" aria-label="Aumentar fonte">A+</button>
                </div>
            </div>

            <div class="config-grupo">
                <span>Tema</span>
                <div class="config-linha">
                    <button type="button" id="tema-claro">☀ Claro</button>
                    <button type="button" id="tema-escuro">🌙 Escuro</button>
                </div>
            </div>

            <button type="button" class="config-restaurar" id="config-restaurar">Restaurar padrão</button>
        </div>

        <button type="button" class="config-botao" id="config-abrir" aria-label="Abrir configurações" aria-expanded="false" aria-controls="config-painel">⚙</button>
    </div>
</body>

</html>
