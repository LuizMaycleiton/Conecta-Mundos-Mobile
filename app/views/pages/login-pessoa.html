<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../public/css/config.css">
    <link rel="stylesheet" href="../../public/css/login.css">
    <title>Login - Conecta Mundos</title>
    <script src="../../public/js/config.js"></script>
</head>

<body>
    <header>
        <div class="logo">
            <a href="../../views/pages/index.html">
                <img src="../../public/imagem/logo_degrade.png" alt="Logo Conecta Mundos">
            </a>
        </div>
        <div class="navegacao">
        </div>
    </header>

    <main>
        <div class="textos">
            <div class="title">
                <h2>Bem-vindo de volta</h2>
            </div>
            <div class="logins">
                <p>Ainda não tem uma conta? <span><a href="./cadastro-pessoa.html">Cadastre-se</a></span></p>
                <p>Já tem conta de ONG? <span><a href="./login-ongs.html">Entre agora</a></span></p>
                <p>Tem uma ONG? <span><a href="./cadastro-ong.html">Cadastre-se</a></span></p>
            </div>
        </div>

        <div class="login-rapidos">
            <button type="button" class="login-btn">
                <img class="icone" src="../../public/imagem/google (1).png" alt="Ícone Google">
                Google
            </button>
            <button type="button" class="login-btn">
                <img class="icone" src="../../public/imagem/facebook.png" alt="Ícone Facebook">
                Facebook
            </button>
        </div>

        <div class="divisao">
            <hr>
            <p>Ou entre com e-mail</p>
            <hr>
        </div>

        <form class="formulario" action="#" method="POST">
            <div class="campo">
                <label for="email-login">E-mail</label>
                <input type="email" id="email-login" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="campo">
                <label for="senha-login">Senha</label>
                <input type="password" id="senha-login" name="senha" placeholder="Digite sua senha" required>
            </div>

            <div class="botao">
                <button type="submit" class="entrar">Entrar</button>
            </div>
        </form>
    </main>

    <!-- Configurações (fonte e tema) -->
    <div class="config">
        <div class="config-painel" id="config-painel" hidden>
            <h3>Configurações</h3>

            <div class="config-grupo">
                <span>Tamanho da fonte</span>
                <div class="config-linha">
                    <button type="button" id="fonte-menos" aria-label="Diminuir fonte">A−</button>
                    <div class="config-valor" id="fonte-valor" aria-live="polite">100%</div>
                    <button type="button" id="fonte-mais" aria-label="Aumentar fonte">A+</button>
                </div>
            </div>

            <div class="config-grupo">
                <span>Tema</span>
                <div class="config-linha">
                    <button type="button" id="tema-claro">☀ Claro</button>
                    <button type="button" id="tema-escuro">🌙 Escuro</button>
                </div>
            </div>

            <button type="button" class="config-restaurar" id="config-restaurar">Restaurar padrão</button>
        </div>

        <button type="button" class="config-botao" id="config-abrir" aria-label="Abrir configurações" aria-expanded="false" aria-controls="config-painel">⚙</button>
    </div>
</body>

</html>
